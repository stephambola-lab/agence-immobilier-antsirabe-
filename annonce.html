<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Annonce immobilière - Antsirabe Immo</title>

<meta name="theme-color" content="#071a2d">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#172033;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  background:#071a2d;
  color:white;
  padding:15px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 3px 15px #0003;
}

.brand{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.brand span{
  color:#f4b942;
}

nav{
  display:flex;
  align-items:center;
  gap:8px;
}

nav a{
  padding:9px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:700;
}

nav a:hover{
  background:#ffffff15;
}

.admin-link{
  background:#f4b942;
  color:#102238;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:35px 4% 60px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:20px;
  color:#174f83;
  font-weight:800;
}

.back:hover{
  text-decoration:underline;
}

.detail{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 35px #00000012;
  border:1px solid #e6ebf0;
}

.main-photo{
  height:480px;
  background:#dfe6ed;
  position:relative;
  overflow:hidden;
}

.main-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.no-photo{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#748094;
  font-weight:800;
  font-size:18px;
}

.photo-badge{
  position:absolute;
  left:16px;
  top:16px;
  background:#f4b942;
  color:#102238;
  padding:8px 13px;
  border-radius:20px;
  font-weight:900;
  font-size:13px;
}

.photo-number{
  position:absolute;
  right:16px;
  bottom:16px;
  background:#0009;
  color:white;
  padding:8px 13px;
  border-radius:20px;
  font-weight:800;
}

.content{
  padding:30px;
}

.title{
  font-size:34px;
  line-height:1.2;
  margin:0 0 12px;
  color:#102238;
}

.location{
  color:#667085;
  font-size:16px;
  margin-bottom:22px;
}

.price{
  font-size:29px;
  font-weight:900;
  color:#174f83;
  margin-bottom:25px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:28px;
}

.info{
  background:#f5f7fa;
  border:1px solid #e5e9ef;
  border-radius:12px;
  padding:15px;
}

.info-label{
  color:#7b8794;
  font-size:12px;
  margin-bottom:5px;
  font-weight:700;
}

.info-value{
  font-weight:900;
  color:#172033;
}

.section-title{
  font-size:21px;
  margin:28px 0 12px;
  color:#102238;
}

.description{
  color:#536174;
  line-height:1.8;
  white-space:pre-line;
  font-size:16px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:0 20px;
  border-radius:11px;
  font-weight:900;
  border:0;
  cursor:pointer;
  font-size:15px;
}

.btn-primary{
  background:#174f83;
  color:white;
}

.btn-primary:hover{
  background:#0e3d68;
}

.btn-whatsapp{
  background:#168a4a;
  color:white;
}

.btn-whatsapp:hover{
  background:#10713c;
}

.btn-gold{
  background:#f4b942;
  color:#102238;
}

.gallery{
  display:flex;
  gap:10px;
  padding:12px;
  background:#eef2f6;
  overflow-x:auto;
}

.thumb{
  width:95px;
  height:72px;
  flex:0 0 auto;
  border-radius:9px;
  overflow:hidden;
  border:2px solid transparent;
  cursor:pointer;
  background:#dfe6ed;
}

.thumb.active{
  border-color:#f4b942;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Galerie plein écran */
.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:#000e;
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.viewer.show{
  display:flex;
}

.viewer img{
  max-width:94vw;
  max-height:84vh;
  object-fit:contain;
  border-radius:10px;
}

.viewer-close,
.viewer-prev,
.viewer-next{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid #fff4;
  background:#ffffff18;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.viewer-close{
  right:18px;
  top:18px;
}

.viewer-prev{
  left:18px;
  top:50%;
  transform:translateY(-50%);
}

.viewer-next{
  right:18px;
  top:50%;
  transform:translateY(-50%);
}

.viewer-count{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#0009;
  color:white;
  padding:7px 13px;
  border-radius:20px;
  font-weight:800;
}

.loading,
.error{
  background:white;
  border-radius:16px;
  padding:40px 20px;
  text-align:center;
  box-shadow:0 5px 25px #0001;
}

.error{
  color:#b42318;
}

/* Responsive */
@media(max-width:700px){

  header{
    padding:12px 4%;
  }

  .brand{
    font-size:17px;
  }

  nav a{
    display:none;
  }

  nav .admin-link{
    display:block;
    font-size:11px;
    padding:9px 10px;
  }

  .page{
    padding:22px 3% 45px;
  }

  .main-photo{
    height:300px;
  }

  .content{
    padding:20px;
  }

  .title{
    font-size:25px;
  }

  .price{
    font-size:24px;
  }

  .info-grid{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .gallery{
    padding:9px;
  }

  .thumb{
    width:80px;
    height:62px;
  }

  .viewer-prev{
    left:7px;
  }

  .viewer-next{
    right:7px;
  }
}

@media(max-width:430px){

  .info-grid{
    grid-template-columns:1fr;
  }

  .main-photo{
    height:260px;
  }

  .content{
    padding:17px;
  }
}
</style>
</head>

<body>

<header>
  <a class="brand" href="index.html">
    Antsirabe <span>Immo</span>
  </a>

  <nav>
    <a href="index.html#biens">Biens</a>
    <a href="index.html#agence">L'agence</a>
    <a href="index.html#demande">Demande</a>
    <a href="index.html#contact">Contact</a>
    <a class="admin-link" href="admin.html">Administration</a>
  </nav>
</header>

<main class="page">

  <a class="back" href="index.html#biens">
    ← Retour aux annonces
  </a>

  <div id="app">
    <div class="loading">
      Chargement de l'annonce...
    </div>
  </div>

</main>

<!-- Visionneuse photos -->
<div class="viewer" id="viewer">

  <button class="viewer-close" onclick="closeViewer()">×</button>

  <button class="viewer-prev" onclick="previousPhoto()">‹</button>

  <img id="viewerImage" src="" alt="Photo du bien">

  <button class="viewer-next" onclick="nextPhoto()">›</button>

  <div class="viewer-count" id="viewerCount">
    1 / 1
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://byezzcuqrweyhdjfnaky.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_F7SXxP6kxgh-7or2MEIJ2g_qQInvd-D";

const API =
  SUPABASE_URL + "/rest/v1/annonces";

const STORAGE_PUBLIC =
  SUPABASE_URL + "/storage/v1/object/public/annonces-images/";

const WHATSAPP =
  "261344171196";

let annonce = null;
let photos = [];
let currentPhoto = 0;


/* =========================
   OUTILS
========================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatPrice(value){

  if(value === null || value === undefined || value === ""){
    return "Prix sur demande";
  }

  const number = Number(value);

  if(Number.isNaN(number)){
    return escapeHtml(value);
  }

  return new Intl.NumberFormat("fr-FR").format(number) + " Ar";
}


/* =========================
   PHOTOS
========================= */

function imgUrl(value){

  if(!value) return "";

  const str = String(value).trim();

  if(!str) return "";

  if(
    str.startsWith("http://") ||
    str.startsWith("https://") ||
    str.startsWith("data:")
  ){
    return str;
  }

  return STORAGE_PUBLIC + encodeURIComponent(str);
}


function getPhotos(a){

  let result = [];

  /*
    Nouveau système :
    image_url contient un JSON
    ex: ["photo1.jpg","photo2.jpg"]
  */
  if(a.image_url){

    if(Array.isArray(a.image_url)){

      result = a.image_url;

    }else if(typeof a.image_url === "string"){

      try{

        const parsed = JSON.parse(a.image_url);

        if(Array.isArray(parsed)){
          result = parsed;
        }else if(parsed){
          result = [parsed];
        }

      }catch(e){

        result = a.image_url
          .split(",")
          .map(x => x.trim())
          .filter(Boolean);
      }
    }
  }

  /* Ancien système images */
  if(!result.length && a.images){

    if(Array.isArray(a.images)){

      result = a.images;

    }else if(typeof a.images === "string"){

      try{

        const parsed = JSON.parse(a.images);

        if(Array.isArray(parsed)){
          result = parsed;
        }

      }catch(e){

        result = a.images
          .split(",")
          .map(x => x.trim())
          .filter(Boolean);
      }
    }
  }

  /* Ancienne photo unique */
  if(!result.length && a.image){
    result = [a.image];
  }

  return result
    .filter(Boolean)
    .map(imgUrl);
}


/* =========================
   CHARGEMENT ANNONCE
========================= */

async function loadAnnonce(){

  const app = document.getElementById("app");

  const params = new URLSearchParams(
    window.location.search
  );

  const id = params.get("id");

  if(!id){

    app.innerHTML = `
      <div class="error">
        <strong>Annonce introuvable.</strong><br><br>
        Aucun identifiant d'annonce n'a été fourni.
      </div>
    `;

    return;
  }

  try{

    const url =
      API +
      "?id=eq." +
      encodeURIComponent(id) +
      "&statut=eq.publiee" +
      "&select=*";

    const response = await fetch(url,{
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer " + SUPABASE_KEY
      }
    });

    if(!response.ok){

      throw new Error(
        await response.text()
      );
    }

    const data = await response.json();

    if(!Array.isArray(data) || !data.length){

      app.innerHTML = `
        <div class="error">
          <strong>Annonce introuvable.</strong><br><br>
          Cette annonce n'est plus disponible.
        </div>
      `;

      return;
    }

    annonce = data[0];

    photos = getPhotos(annonce);

    renderAnnonce();

    /*
      Comptage des vues.
      La fonction SQL existe déjà dans Supabase.
    */
    incrementViews(annonce.id);

  }catch(error){

    console.error(error);

    app.innerHTML = `
      <div class="error">
        <strong>Impossible de charger l'annonce.</strong><br><br>
        Vérifiez votre connexion puis réessayez.
      </div>
    `;
  }
}


/* =========================
   AFFICHAGE
========================= */

function renderAnnonce(){

  const app = document.getElementById("app");

  const titre =
    escapeHtml(
      annonce.titre || "Bien immobilier"
    );

  const type =
    escapeHtml(
      annonce.type || "Bien immobilier"
    );

  const transaction =
    escapeHtml(
      annonce.transaction || "Non précisée"
    );

  const lieu =
    escapeHtml(
      annonce.localisation ||
      annonce.lieu ||
      "Antsirabe"
    );

  const prix =
    formatPrice(annonce.prix);

  const description =
    annonce.description
      ? escapeHtml(annonce.description)
      : "Aucune description disponible pour ce bien.";

  const firstPhoto =
    photos.length
      ? photos[0]
      : "";

  let galleryHtml = "";

  if(photos.length > 1){

    galleryHtml = `
      <div class="gallery">

        ${photos.map((photo,index)=>`

          <div
            class="thumb ${index === 0 ? "active" : ""}"
            onclick="selectPhoto(${index})"
          >
            <img
              src="${photo}"
              alt="Photo ${index + 1}"
              loading="lazy"
            >
          </div>

        `).join("")}

      </div>
    `;
  }

  app.innerHTML = `

    <article class="detail">

      <div class="main-photo">

        ${
          firstPhoto

          ? `
            <img
              id="mainPhoto"
              src="${firstPhoto}"
              alt="${titre}"
              onclick="openViewer(currentPhoto)"
            >
          `

          : `
            <div class="no-photo">
              Aucune photo disponible
            </div>
          `
        }

        <span class="photo-badge">
          ${transaction || type}
        </span>

        ${
          photos.length
          ? `
            <span class="photo-number">
              📷 ${photos.length} photo${photos.length > 1 ? "s" : ""}
            </span>
          `
          : ""
        }

      </div>

      ${galleryHtml}

      <div class="content">

        <h1 class="title">
          ${titre}
        </h1>

        <div class="location">
          📍 ${lieu}
        </div>

        <div class="price">
          ${prix}
        </div>

        <div class="info-grid">

          <div class="info">
            <div class="info-label">
              TYPE DE BIEN
            </div>

            <div class="info-value">
              🏠 ${type}
            </div>
          </div>

          <div class="info">
            <div class="info-label">
              TRANSACTION
            </div>

            <div class="info-value">
              ${transaction}
            </div>
          </div>

          <div class="info">
            <div class="info-label">
              LOCALISATION
            </div>

            <div class="info-value">
              📍 ${lieu}
            </div>
          </div>

        </div>

        <h2 class="section-title">
          Description
        </h2>

        <div class="description">
          ${description}
        </div>

        <div class="actions">

          <a
            class="btn btn-whatsapp"
            target="_blank"
            rel="noopener"
            href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(
              "Bonjour, je suis intéressé(e) par l'annonce : " +
              (annonce.titre || "Bien immobilier") +
              " — " +
              window.location.href
            )}"
          >
            💬 Contacter l'agence
          </a>

          <a
            class="btn btn-primary"
            href="index.html#demande"
          >
            📝 Faire une demande
          </a>

          <a
            class="btn btn-gold"
            href="index.html#biens"
          >
            ← Voir les autres biens
          </a>

        </div>

      </div>

    </article>

  `;
}


/* =========================
   SELECTION PHOTO
========================= */

function selectPhoto(index){

  if(!photos[index]) return;

  currentPhoto = index;

  const main =
    document.getElementById("mainPhoto");

  if(main){
    main.src = photos[index];
  }

  document
    .querySelectorAll(".thumb")
    .forEach((element,i)=>{

      element.classList.toggle(
        "active",
        i === index
      );

    });
}


/* =========================
   GALERIE
========================= */

function openViewer(index){

  if(!photos.length) return;

  currentPhoto = index;

  updateViewer();

  document
    .getElementById("viewer")
    .classList.add("show");

  document.body.style.overflow = "hidden";
}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("show");

  document.body.style.overflow = "";
}


function updateViewer(){

  const image =
    document.getElementById("viewerImage");

  const count =
    document.getElementById("viewerCount");

  if(!photos.length) return;

  image.src = photos[currentPhoto];

  count.textContent =
    (currentPhoto + 1) +
    " / " +
    photos.length;
}


function nextPhoto(){

  if(!photos.length) return;

  currentPhoto =
    (currentPhoto + 1) % photos.length;

  updateViewer();
}


function previousPhoto(){

  if(!photos.length) return;

  currentPhoto =
    (currentPhoto - 1 + photos.length) %
    photos.length;

  updateViewer();
}


/* Fermer en cliquant hors de l'image */
document
  .getElementById("viewer")
  .addEventListener("click",function(event){

    if(event.target === this){
      closeViewer();
    }

  });


/* Clavier */
document.addEventListener("keydown",function(event){

  const viewer =
    document.getElementById("viewer");

  if(!viewer.classList.contains("show")){
    return;
  }

  if(event.key === "Escape"){
    closeViewer();
  }

  if(event.key === "ArrowRight"){
    nextPhoto();
  }

  if(event.key === "ArrowLeft"){
    previousPhoto();
  }

});


/* =========================
   VUES
========================= */

async function incrementViews(id){

  try{

    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/increment_annonce_vues",
      {
        method:"POST",

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          p_id:id
        })
      }
    );

  }catch(error){

    console.log(
      "Compteur de vues :",
      error
    );

  }
}


/* =========================
   START
========================= */

loadAnnonce();

</script>

</body>
</html>

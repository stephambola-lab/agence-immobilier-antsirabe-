<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Annonce - Antsirabe Immo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

header{
  background:#0b1f3a;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#d9ad5b;
}

.back{
  color:white;
  text-decoration:none;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.gallery{
  position:relative;
  background:#111;
  width:100%;
  height:500px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.prev,
.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:25px;
  cursor:pointer;
}

.prev{
  left:15px;
}

.next{
  right:15px;
}

.photo-count{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:white;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
}

.content{
  padding:25px;
}

.title{
  font-size:28px;
  font-weight:900;
  margin:0 0 12px;
}

.price{
  font-size:24px;
  font-weight:900;
  color:#0b6b45;
  margin-bottom:12px;
}

.location{
  color:#657080;
  font-size:16px;
  margin-bottom:20px;
}

.description{
  white-space:pre-line;
  line-height:1.7;
  color:#394454;
  margin-top:20px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

.actions button,
.actions a{
  border:none;
  text-decoration:none;
  padding:12px 17px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.whatsapp{
  background:#25D366;
  color:white;
}

.call{
  background:#0b6bff;
  color:white;
}

.facebook{
  background:#1877F2;
  color:white;
}

.copy{
  background:#eef2f7;
  color:#172033;
}

.share{
  background:#0b1f3a;
  color:white;
}

.message{
  text-align:center;
  padding:50px 20px;
  color:#687386;
  font-size:18px;
}

@media(max-width:600px){

  header{
    padding:14px 15px;
  }

  .logo{
    font-size:20px;
  }

  .gallery{
    height:300px;
  }

  .content{
    padding:20px;
  }

  .title{
    font-size:23px;
  }

  .price{
    font-size:21px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .actions button,
  .actions a{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Antsirabe Immo</div>
  <a class="back" href="index.html">← Retour</a>
</header>

<div class="container">
  <div id="content">
    <div class="message">Chargement de l'annonce...</div>
  </div>
</div>

<script>

const SUPABASE_URL =
  "https://byezzcuqrweyhdjfnaky.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_F7SXxP6kxgh-7or2MEIJ2g_qQInvd-D";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let currentAnnonce = null;
let photos = [];
let currentPhoto = 0;


/* =========================
   RÉCUPÉRER LES PHOTOS
========================= */

function getPhotos(imageUrl){

  if(!imageUrl) return [];

  try{

    const parsed = JSON.parse(imageUrl);

    if(Array.isArray(parsed)){
      return parsed;
    }

  }catch(e){}

  return [imageUrl];
}


/* =========================
   AFFICHER L'ANNONCE
========================= */

function renderAnnonce(a){

  const content = document.getElementById("content");

  photos = getPhotos(a.image_url);
  currentPhoto = 0;

  const firstPhoto =
    photos.length > 0
      ? photos[0]
      : "";

  content.innerHTML = `

    <div class="card">

      <div class="gallery">

        ${
          firstPhoto
          ?
          `<img id="mainPhoto"
                src="${firstPhoto}"
                alt="${a.titre || "Annonce"}">`
          :
          `<div style="color:white">
             Aucune photo
           </div>`
        }

        ${
          photos.length > 1
          ?
          `
          <button
            class="prev"
            onclick="previousPhoto()">
            ‹
          </button>

          <button
            class="next"
            onclick="nextPhoto()">
            ›
          </button>

          <div
            id="photoCount"
            class="photo-count">
            1 / ${photos.length}
          </div>
          `
          :
          ""
        }

      </div>

      <div class="content">

        <h1 class="title">
          ${escapeHtml(a.titre || "")}
        </h1>

        <div class="price">
          ${formatPrice(a.prix)}
        </div>

        <div class="location">
          📍 ${escapeHtml(a.localisation || "")}
        </div>

        <div class="description">
          ${escapeHtml(a.description || "")}
        </div>

        <div class="actions">

          <a
            class="whatsapp"
            href="https://wa.me/261344171196?text=${encodeURIComponent(
              "Bonjour, je suis intéressé par cette annonce : " +
              (a.titre || "") +
              " - " +
              window.location.href
            )}"
            target="_blank">
            WhatsApp
          </a>

          <a
            class="call"
            href="tel:0344171196">
            📞 Appeler
          </a>

          <button
            class="facebook"
            onclick="shareFacebook()">
            Facebook
          </button>

          <button
            class="copy"
            onclick="copyLink()">
            🔗 Copier le lien
          </button>

          <button
            class="share"
            onclick="shareAnnonce()">
            📤 Partager
          </button>

        </div>

      </div>

    </div>
  `;
}


/* =========================
   CHANGER PHOTO
========================= */

function showPhoto(){

  const img = document.getElementById("mainPhoto");

  if(!img || photos.length === 0) return;

  img.src = photos[currentPhoto];

  const count =
    document.getElementById("photoCount");

  if(count){
    count.textContent =
      `${currentPhoto + 1} / ${photos.length}`;
  }
}


function nextPhoto(){

  if(photos.length <= 1) return;

  currentPhoto =
    (currentPhoto + 1) % photos.length;

  showPhoto();
}


function previousPhoto(){

  if(photos.length <= 1) return;

  currentPhoto =
    (currentPhoto - 1 + photos.length)
    % photos.length;

  showPhoto();
}


/* =========================
   COMPTEUR DE VUES
========================= */

async function incrementViews(){

  if(!id) return;

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/increment_annonce_vues",
      {
        method:"POST",

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          p_id:id
        })
      }
    );

    if(!response.ok){

      console.log(
        "Compteur non disponible:",
        await response.text()
      );

    }

  }catch(error){

    console.log(
      "Erreur compteur:",
      error
    );

  }
}


/* =========================
   PARTAGE FACEBOOK
========================= */

function shareFacebook(){

  const url =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(window.location.href);

  window.open(
    url,
    "_blank",
    "width=600,height=500"
  );
}


/* =========================
   COPIER LE LIEN
========================= */

async function copyLink(){

  try{

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert("Lien copié !");

  }catch(e){

    alert(
      "Impossible de copier le lien."
    );

  }
}


/* =========================
   PARTAGER
========================= */

async function shareAnnonce(){

  const title =
    currentAnnonce?.titre ||
    "Annonce Antsirabe Immo";

  const text =
    "Découvrez cette annonce sur Antsirabe Immo : " +
    title;

  if(navigator.share){

    try{

      await navigator.share({
        title:title,
        text:text,
        url:window.location.href
      });

    }catch(e){}

  }else{

    await copyLink();

  }
}


/* =========================
   PRIX
========================= */

function formatPrice(price){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){
    return "Prix sur demande";
  }

  const number =
    Number(
      String(price)
      .replace(/\s/g,"")
      .replace(/,/g,"")
    );

  if(isNaN(number)){
    return escapeHtml(String(price));
  }

  return number.toLocaleString("fr-FR") + " Ar";
}


/* =========================
   SÉCURISER LE TEXTE
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   CHARGER L'ANNONCE
========================= */

async function loadAnnonce(){

  if(!id){

    document.getElementById("content").innerHTML =
      `<div class="message">
        Annonce introuvable.
       </div>`;

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/annonces" +
      "?id=eq." +
      encodeURIComponent(id) +
      "&statut=eq.publiee" +
      "&select=*",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      throw new Error(
        "Erreur serveur"
      );

    }

    const data =
      await response.json();

    if(!data || data.length === 0){

      document.getElementById("content").innerHTML =
        `<div class="message">
          Cette annonce n'est plus disponible.
         </div>`;

      return;
    }

    const annonce = data[0];

    currentAnnonce = annonce;

    renderAnnonce(annonce);

    /* 
       Le compteur est exécuté après
       l'affichage de l'annonce.
       Il n'est donc pas visible sur
       le site public.
    */
    incrementViews();

  }catch(error){

    console.error(error);

    document.getElementById("content").innerHTML =
      `<div class="message">
        Impossible de charger l'annonce.
       </div>`;

  }
}


/* =========================
   CLAVIER
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "ArrowRight"){
      nextPhoto();
    }

    if(e.key === "ArrowLeft"){
      previousPhoto();
    }

  }
);


/* =========================
   DÉMARRAGE
========================= */

loadAnnonce();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Annonce - Antsirabe Immo</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#17202a;
}

header{
  background:#0b2239;
  color:white;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.back{
  color:white;
  text-decoration:none;
  font-weight:700;
  background:#174f83;
  padding:10px 14px;
  border-radius:8px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.main-photo{
  width:100%;
  height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
  background:#e9edf2;
}

.no-photo{
  width:100%;
  height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e9edf2;
  color:#777;
  font-weight:700;
}

.gallery{
  display:flex;
  gap:10px;
  padding:12px;
  overflow-x:auto;
  background:#f0f2f5;
}

.thumb{
  width:95px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  border:3px solid transparent;
  flex-shrink:0;
}

.thumb.active{
  border-color:#c99a32;
}

.content{
  padding:28px;
}

h1{
  margin:0 0 10px;
  color:#0b2239;
  font-size:30px;
}

.location{
  color:#59636e;
  font-size:16px;
  margin-bottom:15px;
}

.price{
  color:#b8860b;
  font-size:27px;
  font-weight:900;
  margin-bottom:22px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:25px;
}

.info{
  background:#f5f7fa;
  border-radius:10px;
  padding:15px;
}

.info strong{
  display:block;
  color:#0b2239;
  margin-bottom:5px;
}

.description{
  line-height:1.7;
  white-space:pre-line;
  color:#3d4650;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:13px 18px;
  border-radius:9px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
}

.whatsapp{
  background:#168c45;
  color:white;
}

.share{
  background:#0b2239;
  color:white;
}

.demand{
  background:#c99a32;
  color:#111;
}

.other{
  background:#e9edf2;
  color:#0b2239;
}

/* VIEWER */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:9999;
  align-items:center;
  justify-content:center;
}

.viewer.show{
  display:flex;
}

.viewer img{
  max-width:92%;
  max-height:88vh;
  object-fit:contain;
}

.viewer-close{
  position:absolute;
  top:18px;
  right:22px;
  color:white;
  font-size:38px;
  cursor:pointer;
  z-index:2;
}

.viewer-prev,
.viewer-next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,.15);
  color:white;
  border:none;
  font-size:35px;
  width:50px;
  height:60px;
  border-radius:8px;
  cursor:pointer;
}

.viewer-prev{
  left:18px;
}

.viewer-next{
  right:18px;
}

.message{
  text-align:center;
  padding:60px 20px;
  color:#666;
  font-size:18px;
}

.error{
  background:#ffe8e8;
  color:#a00000;
  padding:20px;
  border-radius:10px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:13px 4%;
  }

  .logo{
    font-size:17px;
  }

  .back{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    margin:15px auto;
    padding:0 10px;
  }

  .main-photo{
    height:300px;
  }

  .no-photo{
    height:300px;
  }

  .content{
    padding:20px 16px;
  }

  h1{
    font-size:23px;
  }

  .price{
    font-size:23px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .viewer-prev,
  .viewer-next{
    width:42px;
    height:50px;
    font-size:28px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    🏠 Antsirabe Immo
  </div>

  <a href="index.html#biens" class="back">
    ← Retour aux biens
  </a>

</header>


<div class="container">

  <div id="loading" class="message">
    Chargement de l'annonce...
  </div>

  <div id="error" class="message" style="display:none;">
    <div class="error">
      Impossible de charger cette annonce.
    </div>
  </div>


  <div id="annonceCard" class="card" style="display:none;">

    <div id="photoArea"></div>

    <div id="gallery" class="gallery"></div>

    <div class="content">

      <h1 id="titre"></h1>

      <div id="location" class="location"></div>

      <div id="prix" class="price"></div>


      <div class="info-grid">

        <div class="info">
          <strong>Type de bien</strong>
          <span id="type"></span>
        </div>

        <div class="info">
          <strong>Transaction</strong>
          <span id="transaction"></span>
        </div>

        <div class="info">
          <strong>Localisation</strong>
          <span id="localisation"></span>
        </div>

      </div>


      <h3>Description</h3>

      <div id="description" class="description"></div>


      <div class="actions">

        <a
          id="whatsapp"
          class="btn whatsapp"
          target="_blank"
          rel="noopener"
        >
          💬 WhatsApp
        </a>

        <button
          id="shareBtn"
          class="btn share"
          type="button"
        >
          📤 Partager
        </button>

        <a
          class="btn demand"
          href="index.html#demande"
        >
          📩 Faire une demande
        </a>

        <a
          class="btn other"
          href="index.html#biens"
        >
          🏠 Voir les autres biens
        </a>

      </div>

    </div>

  </div>

</div>


<!-- PHOTO VIEWER -->

<div id="viewer" class="viewer">

  <span
    id="viewerClose"
    class="viewer-close"
  >
    ×
  </span>

  <button
    id="viewerPrev"
    class="viewer-prev"
  >
    ‹
  </button>

  <img
    id="viewerImg"
    src=""
    alt="Photo"
  >

  <button
    id="viewerNext"
    class="viewer-next"
  >
    ›
  </button>

</div>


<script>

const SUPABASE_URL =
  "https://byezzcuqrweyhdjfnaky.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_F7SXxP6kxgh-7or2MEIJ2g_qQInvd-D";

const BUCKET =
  "annonces-images";


let annonce = null;
let photos = [];
let currentPhoto = 0;


/* =========================
   UTILITAIRES
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatPrice(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "Prix sur demande";
  }

  const number = Number(value);

  if(Number.isNaN(number)){
    return escapeHtml(value);
  }

  return number.toLocaleString("fr-FR") + " Ar";

}


/* =========================
   PHOTOS
========================= */

function imgUrl(filename){

  if(!filename){
    return "";
  }

  if(
    typeof filename === "string" &&
    /^https?:\/\//i.test(filename)
  ){
    return filename;
  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    String(filename)
      .split("/")
      .map(part => encodeURIComponent(part))
      .join("/")
  );

}


function getPhotos(a){

  let result = [];


  /* image_url */

  if(a.image_url){

    if(Array.isArray(a.image_url)){

      result = a.image_url;

    }else if(typeof a.image_url === "string"){

      try{

        const parsed =
          JSON.parse(a.image_url);

        if(Array.isArray(parsed)){

          result = parsed;

        }else if(parsed){

          result = [parsed];

        }

      }catch(e){

        result =
          a.image_url
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

      }

    }

  }


  /* images */

  if(!result.length && a.images){

    if(Array.isArray(a.images)){

      result = a.images;

    }else if(typeof a.images === "string"){

      try{

        const parsed =
          JSON.parse(a.images);

        if(Array.isArray(parsed)){

          result = parsed;

        }

      }catch(e){

        result =
          a.images
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

      }

    }

  }


  /* image ancienne version */

  if(!result.length && a.image){

    result = [a.image];

  }


  return result
    .filter(Boolean)
    .map(imgUrl);

}


/* =========================
   CHARGEMENT
========================= */

async function loadAnnonce(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if(!id){

    document.getElementById("loading")
      .style.display = "none";

    document.getElementById("error")
      .style.display = "block";

    return;

  }


  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/annonces" +
      "?id=eq." +
      encodeURIComponent(id) +
      "&statut=eq.publiee" +
      "&select=*";


    const response =
      await fetch(url,{

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }

      });


    if(!response.ok){

      throw new Error(
        "Erreur Supabase"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      throw new Error(
        "Annonce introuvable"
      );

    }


    annonce = data[0];

    photos =
      getPhotos(annonce);


    renderAnnonce();

    incrementViews(id);


  }catch(error){

    console.error(error);

    document.getElementById("loading")
      .style.display = "none";

    document.getElementById("error")
      .style.display = "block";

  }

}


/* =========================
   AFFICHAGE
========================= */

function renderAnnonce(){

  document.getElementById("loading")
    .style.display = "none";

  document.getElementById("annonceCard")
    .style.display = "block";


  const titre =
    annonce.titre ||
    "Bien immobilier";


  document.title =
    titre + " - Antsirabe Immo";


  document.getElementById("titre")
    .textContent = titre;


  document.getElementById("location")
    .textContent =
      "📍 " +
      (
        annonce.localisation ||
        annonce.lieu ||
        "Antsirabe"
      );


  document.getElementById("prix")
    .textContent =
      formatPrice(annonce.prix);


  document.getElementById("type")
    .textContent =
      annonce.type ||
      "Non précisé";


  document.getElementById("transaction")
    .textContent =
      annonce.transaction ||
      "Non précisé";


  document.getElementById("localisation")
    .textContent =
      annonce.localisation ||
      annonce.lieu ||
      "Antsirabe";


  document.getElementById("description")
    .textContent =
      annonce.description ||
      "Aucune description disponible.";


  renderPhotos();

  setupButtons();

}


/* =========================
   GALERIE
========================= */

function renderPhotos(){

  const photoArea =
    document.getElementById("photoArea");

  const gallery =
    document.getElementById("gallery");


  gallery.innerHTML = "";


  if(!photos.length){

    photoArea.innerHTML =
      '<div class="no-photo">Aucune photo disponible</div>';

    return;

  }


  photoArea.innerHTML =
    `
      <img
        id="mainPhoto"
        class="main-photo"
        src="${escapeHtml(photos[0])}"
        alt="${escapeHtml(annonce.titre || "Bien immobilier")}"
      >
    `;


  document.getElementById("mainPhoto")
    .addEventListener(
      "click",
      () => openViewer(0)
    );


  photos.forEach(
    (photo,index) => {

      const img =
        document.createElement("img");

      img.className =
        "thumb" +
        (index === 0 ? " active" : "");

      img.src = photo;

      img.alt =
        "Photo " + (index + 1);

      img.addEventListener(
        "click",
        () => changePhoto(index)
      );

      gallery.appendChild(img);

    }
  );

}


function changePhoto(index){

  if(!photos[index]){
    return;
  }

  currentPhoto = index;


  const main =
    document.getElementById("mainPhoto");

  if(main){
    main.src = photos[index];
  }


  document
    .querySelectorAll(".thumb")
    .forEach(
      (element,i) => {

        element.classList.toggle(
          "active",
          i === index
        );

      }
    );

}


/* =========================
   FULL SCREEN
========================= */

function openViewer(index){

  if(!photos.length){
    return;
  }

  currentPhoto = index;

  document.getElementById("viewerImg")
    .src = photos[index];

  document.getElementById("viewer")
    .classList.add("show");

}


function closeViewer(){

  document.getElementById("viewer")
    .classList.remove("show");

}


function previousPhoto(){

  if(!photos.length){
    return;
  }

  currentPhoto =
    (
      currentPhoto - 1 + photos.length
    ) % photos.length;

  document.getElementById("viewerImg")
    .src = photos[currentPhoto];

}


function nextPhoto(){

  if(!photos.length){
    return;
  }

  currentPhoto =
    (
      currentPhoto + 1
    ) % photos.length;

  document.getElementById("viewerImg")
    .src = photos[currentPhoto];

}


document
  .getElementById("viewerClose")
  .addEventListener(
    "click",
    closeViewer
  );


document
  .getElementById("viewerPrev")
  .addEventListener(
    "click",
    previousPhoto
  );


document
  .getElementById("viewerNext")
  .addEventListener(
    "click",
    nextPhoto
  );


document
  .getElementById("viewer")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){
        closeViewer();
      }

    }
  );


document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){
      closeViewer();
    }

    if(e.key === "ArrowLeft"){
      previousPhoto();
    }

    if(e.key === "ArrowRight"){
      nextPhoto();
    }

  }
);


/* =========================
   COMPTEUR VUES
========================= */

async function incrementViews(id){

  try{

    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/increment_annonce_vues",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          p_id:id
        })

      }
    );

  }catch(error){

    console.log(
      "Compteur vues:",
      error
    );

  }

}


/* =========================
   BOUTONS
========================= */

function setupButtons(){

  const id = annonce.id;


  /* WhatsApp */

  const whatsapp =
    document.getElementById("whatsapp");


  const message =
    "Bonjour, je suis intéressé(e) par : " +
    (
      annonce.titre ||
      "une annonce immobilière"
    ) +
    " — " +
    window.location.href;


  whatsapp.href =
    "https://wa.me/261344171196?text=" +
    encodeURIComponent(message);


  /* PARTAGER */

  document
    .getElementById("shareBtn")
    .addEventListener(
      "click",
      () => shareAnnonce()
    );

}


/* =========================
   PARTAGE
========================= */

async function shareAnnonce(){

  if(!annonce){
    return;
  }


  const url =
    window.location.href;


  const title =
    annonce.titre ||
    "Bien immobilier";


  const text =
    "Découvrez cette annonce sur Antsirabe Immo : " +
    title +
    " — " +
    (
      annonce.localisation ||
      annonce.lieu ||
      "Antsirabe"
    );


  /* Téléphones compatibles */

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "Antsirabe Immo",

        text:
          text,

        url:
          url

      });

      return;

    }catch(error){

      /*
        L'utilisateur peut simplement
        avoir fermé le menu de partage.
      */

      console.log(
        "Partage annulé"
      );

      return;

    }

  }


  /* Fallback : copier le lien */

  try{

    await navigator.clipboard
      .writeText(url);

    alert(
      "Lien de l'annonce copié. Vous pouvez maintenant le partager."
    );

  }catch(error){

    prompt(
      "Copiez le lien de cette annonce :",
      url
    );

  }

}


/* =========================
   START
========================= */

loadAnnonce();

</script>

</body>
</html>

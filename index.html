<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agence Immobilier Antsirabe</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
color:#172033
}

header{
background:#102a43;
color:#fff;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:5
}

.logo{font-weight:800}
.logo b{color:#f4b942}

nav a{
color:white;
text-decoration:none;
margin-left:16px;
font-size:14px
}

.hero{
background:linear-gradient(135deg,#102a43,#2563a6);
color:#fff;
padding:55px 5%;
text-align:center
}

.hero h1{
font-size:35px;
margin:0 0 10px
}

.search{
max-width:1000px;
margin:24px auto 0;
background:white;
padding:14px;
border-radius:14px;
display:grid;
grid-template-columns:1fr 1fr 1.2fr auto;
gap:9px
}

.search input,
.search select,
.search button{
padding:12px;
border-radius:8px;
border:1px solid #ddd
}

.search button,
button{
background:#f4b942;
border:0;
font-weight:bold;
cursor:pointer
}

section{
max-width:1200px;
margin:auto;
padding:42px 5%
}

.center{text-align:center}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 3px 15px #0001
}

.photo{
height:200px;
background:linear-gradient(135deg,#dbeafe,#a8b7c8);
display:flex;
align-items:center;
justify-content:center;
color:#40546b;
font-weight:bold
}

.photo img{
width:100%;
height:100%;
object-fit:cover
}

.body{
padding:17px
}

.tag{
font-size:12px;
background:#eaf1fb;
color:#1d4e89;
padding:5px 8px;
border-radius:20px
}

.price{
font-size:19px;
font-weight:800;
color:#1d4e89;
margin:8px 0
}

.location{
color:#526579;
margin:8px 0 15px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.actions a,
.actions button{
display:inline-block;
padding:11px 13px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
border:0;
font-size:14px
}

.visit{
background:#f4b942;
color:#172033
}

.call{
background:#102a43;
color:white
}

.wa{
background:#25d366;
color:white
}

.contact{
background:#102a43;
color:white;
max-width:none;
text-align:center
}

.contact a{
display:inline-block;
padding:13px 19px;
margin:5px;
border-radius:8px;
text-decoration:none;
font-weight:bold
}

.contact .call{
background:white;
color:#102a43
}

.contact .wa{
background:#25d366;
color:white
}

footer{
background:#091c2c;
color:#cbd5e1;
text-align:center;
padding:20px;
font-size:13px
}

.msg{
text-align:center;
padding:20px;
grid-column:1/-1
}

.result{
text-align:center;
margin:15px 0;
color:#526579;
font-size:14px
}

@media(max-width:750px){

header{
flex-direction:column;
gap:12px
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:7px;
width:100%
}

nav a{
margin-left:0;
padding:7px 5px;
font-size:13px
}

.hero h1{
font-size:29px
}

.search,
.grid{
grid-template-columns:1fr
}

.search{
padding:12px
}

.card{
width:100%
}

.actions{
flex-direction:column
}

.actions a,
.actions button{
width:100%;
text-align:center
}
}
</style>
</head>

<header>

<div class="logo">
Agence Immobilier <b>Antsirabe</b>
</div>

<nav>

<a href="#contact">Contact</a>

</nav>

<p>

</p>

<option>Maison</option>
<option>Appartement</option>
<option>Terrain</option>
<option>Local commercial</option>
</select>

<select id="op">
<option value="">Toutes transactions</option>
<option>À vendre</option>
<option>À louer</option>
</select>

<input
id="q"
placeholder="Quartier / localisation"
>

<button onclick="filter()">
🔎 Rechercher
</button>

</div>

</div>


<section id="biens">

<h2 class="center">
Biens disponibles
</h2>

<p class="center">
Contactez l'agence pour organiser une visite.
</p>

<div id="result" class="result"></div>

<div id="cards" class="grid">

<p class="msg">
Chargement des biens...
</p>

</div>

</section>

<h2 class="center">
À propos de l

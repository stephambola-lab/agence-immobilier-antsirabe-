<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2239">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antsirabe Immo">
<link rel="manifest" href="manifest.json">
<title>Antsirabe Immo — Agence immobilière</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#172033;
  background:#f5f7fa;
}

a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#0b2239;
  color:#fff;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 4px 20px #0003;
}

.brand{
  font-weight:900;
  font-size:20px;
  letter-spacing:.2px;
  white-space:nowrap;
}

nav{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

nav a{
  color:#fff;
  padding:9px 12px;
  border-radius:9px;
  font-size:14px;
}

nav a:hover{background:#ffffff18}

.demand-link,
.admin-link{
  background:#f4b942;
  color:#102238!important;
  font-weight:800;
}

.hero{
  min-height:430px;
  padding:75px 5%;
  display:flex;
  align-items:center;
  background:
    linear-gradient(120deg,#071a2d 0%,#0b3556 55%,#174f83 100%);
  color:#fff;
}

.hero-inner{
  max-width:1050px;
  margin:auto;
  width:100%;
}

.badge{
  display:inline-block;
  background:#f4b942;
  color:#102238;
  padding:8px 13px;
  border-radius:22px;
  font-weight:800;
  font-size:13px;
}

.hero h1{
  font-size:clamp(34px,6vw,62px);
  line-height:1.03;
  margin:18px 0 14px;
  max-width:850px;
}

.hero p{
  font-size:18px;
  line-height:1.7;
  color:#dceaf5;
  max-width:720px;
  margin:0;
}

.search-box{
  max-width:1050px;
  margin:-42px auto 45px;
  position:relative;
  z-index:5;
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 12px 40px #0002;
  display:grid;
  grid-template-columns:1fr 1fr 1.4fr auto;
  gap:10px;
}

.search-box select,
.search-box input{
  width:100%;
  min-height:48px;
  border:1px solid #d9e0e7;
  border-radius:11px;
  padding:0 13px;
  background:#fff;
  color:#172033;
  outline:none;
}

.search-box input:focus,
.search-box select:focus{
  border-color:#174f83;
  box-shadow:0 0 0 3px #174f8315;
}

.primary{
  min-height:48px;
  background:#174f83;
  color:#fff;
  padding:0 20px;
  border-radius:11px;
  font-weight:800;
}

.primary:hover{background:#0e3d68}

.primary:disabled{
  opacity:.65;
  cursor:not-allowed;
}

section{padding:55px 5%}

.container{
  max-width:1100px;
  margin:auto;
}

.section-head{
  text-align:center;
  margin-bottom:28px;
}

.section-head h2{
  font-size:30px;
  margin:0 0 9px;
}

.section-head p{
  margin:0;
  color:#697586;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 24px #00000012;
  border:1px solid #e9edf2;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px #0002;
}

.card-photo{
  height:220px;
  background:#dfe6ed;
  position:relative;
  overflow:hidden;
}

.card-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.no-photo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#718096;
  font-weight:800;
}

.tag{
  position:absolute;
  top:12px;
  left:12px;
  background:#f4b942;
  color:#102238;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:900;
}

.photo-count{
  position:absolute;
  right:12px;
  bottom:12px;
  background:#0009;
  color:#fff;
  padding:6px 9px;
  border-radius:18px;
  font-size:12px;
  font-weight:800;
}

.card-body{padding:17px}

.card h3{
  margin:0 0 8px;
  font-size:19px;
}

.meta{
  color:#667587;
  font-size:14px;
  line-height:1.7;
}

.price{
  font-size:20px;
  font-weight:900;
  color:#174f83;
  margin:11px 0;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.card-actions button,
.card-actions a{
  text-align:center;
  padding:11px 8px;
  border-radius:9px;
  font-weight:800;
  font-size:13px;
}

.details{
  background:#174f83;
  color:#fff;
}

.whatsapp{
  background:#25d366;
  color:#fff;
}

.empty,
.msg{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  padding:30px;
  border-radius:14px;
  color:#667587;
  box-shadow:0 5px 20px #0000000c;
}

.error-box{
  grid-column:1/-1;
  background:#fff4f4;
  color:#a02b2b;
  padding:20px;
  border-radius:14px;
  text-align:center;
}

.info-section{background:#fff}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.info-box{
  background:#f5f7fa;
  border-radius:16px;
  padding:24px;
}

.info-box h3{margin-top:0}

.info-box p{
  line-height:1.75;
  color:#596779;
}

.demand-banner{
  background:linear-gradient(120deg,#0b2239,#174f83);
  color:#fff;
  border-radius:20px;
  padding:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.demand-banner h2{margin:0 0 8px}

.demand-banner p{
  margin:0;
  color:#d9e8f5;
  line-height:1.6;
}

.gold-btn{
  background:#f4b942;
  color:#102238;
  padding:13px 18px;
  border-radius:10px;
  font-weight:900;
  white-space:nowrap;
}

.contact{
  background:#0b2239;
  color:#fff;
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.contact-box{
  border:1px solid #ffffff18;
  border-radius:16px;
  padding:22px;
  background:#ffffff08;
}

.contact-box h3{
  margin-top:0;
  color:#f4b942;
}

.contact-box p{
  line-height:1.8;
  color:#dce7f0;
}

.contact-btn{
  display:inline-block;
  padding:11px 15px;
  border-radius:9px;
  background:#25d366;
  color:#fff;
  font-weight:800;
  margin-top:5px;
}

footer{
  background:#071725;
  color:#aebdca;
  text-align:center;
  padding:22px;
  font-size:13px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#0009;
  padding:18px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(620px,100%);
  background:#fff;
  border-radius:18px;
  padding:23px;
  position:relative;
  box-shadow:0 20px 70px #0005;
}

.close{
  position:absolute;
  top:10px;
  right:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#edf1f5;
  color:#172033;
  font-size:22px;
}

.modal-box h2{
  margin:0 45px 8px 0;
}

.modal-box>p{
  color:#697586;
  line-height:1.5;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.form-grid .full{
  grid-column:1/-1;
}

.form-grid label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:0 0 6px;
}

.form-grid input,
.form-grid select,
.form-grid textarea{
  width:100%;
  border:1px solid #d7dfe7;
  border-radius:10px;
  padding:12px;
  outline:none;
}

.form-grid textarea{
  min-height:110px;
  resize:vertical;
}

.form-grid input:focus,
.form-grid select:focus,
.form-grid textarea:focus{
  border-color:#174f83;
  box-shadow:0 0 0 3px #174f8315;
}

.form-submit{
  width:100%;
  margin-top:14px;
  min-height:48px;
}

.small-note{
  font-size:12px;
  color:#7b8794;
  margin-top:9px;
}

.announce-banner{
  margin-top:22px;
  background:#fff;
  border:1px solid #e4e9ef;
  border-radius:20px;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  box-shadow:0 5px 22px #0000000c;
}

.announce-banner h2{
  margin:0 0 8px;
  color:#0b2239;
}

.announce-banner p{
  margin:0;
  color:#697586;
  line-height:1.6;
}

.announce-btn{
  background:#174f83;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  font-weight:900;
  white-space:nowrap;
}

.private-note{
  background:#eef6ff;
  border:1px solid #cfe3f7;
  color:#174f83;
  padding:11px 13px;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
  margin-bottom:14px;
}

.file-box{
  border:2px dashed #cbd5df;
  border-radius:10px;
  padding:12px;
  background:#f8fafc;
}

.file-box input{
  width:100%;
  border:0!important;
  padding:5px!important;
  background:transparent!important;
  box-shadow:none!important;
}

.file-box input::file-selector-button{
  background:#174f83;
  color:#fff;
  border:0;
  padding:10px 13px;
  border-radius:8px;
  margin-right:8px;
  font-weight:800;
  cursor:pointer;
}

#photoPreview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

#photoPreview:empty{
  display:none;
}

.photo-preview-item{
  position:relative;
  height:95px;
  border-radius:9px;
  overflow:hidden;
  border:1px solid #d7dfe7;
  background:#edf1f5;
}

.photo-preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-preview-name{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:5px;
  background:#0008;
  color:#fff;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.photo-number{
  position:absolute;
  top:5px;
  left:5px;
  background:#f4b942;
  color:#102238;
  padding:3px 6px;
  border-radius:10px;
  font-size:10px;
  font-weight:900;
}

.success-note{
  display:none;
  background:#eaf8ef;
  color:#176b37;
  border:1px solid #bfe6cc;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:13px;
  line-height:1.5;
}

.gallery{
  display:none;
  position:fixed;
  inset:0;
  z-index:150;
  background:#000e;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.gallery.show{display:flex}

.gallery img{
  max-width:94vw;
  max-height:82vh;
  object-fit:contain;
  border-radius:10px;
}

.gallery-close,
.gallery-prev,
.gallery-next{
  position:absolute;
  background:#ffffff18;
  color:#fff;
  border:1px solid #fff4;
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:25px;
}

.gallery-close{
  right:18px;
  top:18px;
}

.gallery-prev{
  left:18px;
  top:50%;
  transform:translateY(-50%);
}

.gallery-next{
  right:18px;
  top:50%;
  transform:translateY(-50%);
}

.gallery-count{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-weight:800;
  background:#0008;
  padding:7px 12px;
  border-radius:20px;
}

@media(max-width:850px){

  header{padding:12px 4%}

  .brand{font-size:16px}

  nav{gap:5px}

  nav a{display:none}

  nav .demand-link,
  nav .admin-link{
    display:block;
    padding:9px 10px;
    font-size:12px;
  }

  .search-box{
    grid-template-columns:1fr 1fr;
  }

  .search-box button{
    grid-column:1/-1;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .about-grid,
  .contact-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:12px 4%;
    gap:6px;
  }

  .brand{font-size:16px}

  nav{
    gap:5px;
    flex-shrink:0;
  }

  nav .demand-link,
  nav .admin-link{
    padding:9px 9px;
    font-size:11px;
    border-radius:8px;
  }

  .hero{
    min-height:390px;
    padding:

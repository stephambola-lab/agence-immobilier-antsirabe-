<!doctype html>
<html lang="fr">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Administration | Agence Immobilier Antsirabe</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

/* HEADER */

header{
background:#0b2239;
color:white;
padding:14px 5%;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
box-shadow:0 2px 12px #0003;
}

.brand{
font-size:18px;
font-weight:800;
}

.brand span{
color:#f4b942;
}

.back{
background:#f4b942;
color:#172033;
text-decoration:none;
padding:10px 15px;
border-radius:9px;
font-size:14px;
font-weight:800;
white-space:nowrap;
}

.back:hover{
opacity:.9;
}

/* LOGIN */

.box{
max-width:480px;
margin:45px auto;
background:white;
padding:28px;
border-radius:16px;
box-shadow:0 5px 25px #00000012;
}

.box h2{
margin-top:0;
}

/* ADMIN */

.admin{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.panel{
background:white;
padding:24px;
border-radius:16px;
box-shadow:0 4px 18px #00000012;
}

/* FORM */

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:4px;
}

input,
select,
textarea,
button{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #d9dee5;
border-radius:9px;
font:inherit;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
background:#f4b942;
border:0;
font-weight:800;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

/* BUTTONS */

.logout{
background:#df5757;
color:white;
width:auto;
padding:10px 15px;
}

.ok{
background:#3b8c5a;
color:white;
}

.danger{
background:#df5757;
color:white;
}

/* STATUS */

.error{
color:#c62828;
font-weight:bold;
}

.success{
color:#2e7d32;
font-weight:bold;
}

/* SEPARATOR */

.separator{
height:1px;
background:#e4e8ed;
margin:25px 0;
}

/* ANNONCES */

.title-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.title-row h2{
margin:0;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 18px #00000012;
}

.photo{
height:180px;
background:#dce3ea;
display:flex;
align-items:center;
justify-content:center;
color:#667788;
font-weight:bold;
overflow:hidden;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.body{
padding:16px;
}

.body h3{
margin:0 0 8px;
font-size:18px;
}

.info{
font-size:14px;
line-height:1.7;
color:#5e6a78;
}

.price{
font-size:18px;
font-weight:800;
color:#174f83;
margin:8px 0;
}

.status-badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#edf1f5;
color:#52606d;
margin-top:5px;
}

.status-published{
background:#dff3e6;
color:#287542;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

/* MESSAGE */

.empty{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
color:#667788;
}

/* MOBILE */

@media(max-width:750px){

header{
padding:12px 4%;
}

.brand{
font-size:15px;
}

.back{
font-size:12px;
padding:9px 11px;
}

.admin{
margin:15px auto;
padding:0 10px;
}

.panel{
padding:18px;
}

.form{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.grid{
grid-template-columns:1fr;
}

.title-row{
align-items:flex-start;
flex-direction:column;
}

.logout{
width:auto;
}

.photo{
height:210px;
}

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

<div class="brand">

🔐 Agence Immobilier
<span>Antsirabe</span>

</div>

<a
href="index.html"
class="back">

← Retour au site

</a>

</header>


<!-- LOGIN -->

<div
id="loginBox"
class="box">

<h2>
Connexion administrateur
</h2>

<p>
Connectez-vous pour gérer les annonces.
</p>

<input
id="email"
type="email"
placeholder="Adresse email">

<input
id="password"
type="password"
placeholder="Mot de passe">

<button
id="loginBtn">

Se connecter

</button>

<p id="message"></p>

</div>


<!-- ADMIN -->

<div
id="adminBox"
class="admin"
style="display:none">


<!-- AJOUT -->

<div class="panel">

<div class="title-row">

<h2>
Ajouter une annonce
</h2>

<button
id="logoutBtn"
class="logout">

Déconnexion

</button>

</div>


<div class="form">


<div>

<label>
Type
</label>

<select id="type">

<option>
Maison
</option>

<option>
Appartement
</option>

<option>
Terrain
</option>

<option>
Local commercial
</option>

</select>

</div>


<div>

<label>
Transaction
</label>

<select id="transaction">

<option>
À vendre
</option>

<option>
À louer
</option>

</select>

</div>


<div>

<label>
Titre
</label>

<input
id="titre"
placeholder="Belle maison à Antsirabe">

</div>


<div>

<label>
Prix (Ar)
</label>

<input
id="prix"
type="number"
placeholder="Ex : 150000000">

</div>


<div>

<label>
Localisation
</label>

<input
id="lieu"
placeholder="Ex : Antsenakely, Antsirabe">

</div>


<div>

<label>
Photo
</label>

<input
id="photos"
type="file"
accept="image/*">

</div>


<div class="full">

<label>
Description
</label>

<textarea
id="description"
placeholder="Décrivez le bien : chambres, terrain, accès, équipements, etc.">
</textarea>

</div>


</div>


<button
id="addBtn">

Enregistrer l'annonce

</button>

<p id="status"></p>

</div>


<div class="separator"></div>


<!-- LISTE -->

<div>

<div class="title-row">

<h2>
Toutes les annonces
</h2>

</div>

<div
id="list"
class="grid">
</div>

</div>


</div>


<script>


/* SUPABASE */

const URL =
"https://byezzcuqrweyhdjfnaky.supabase.co";

const KEY =
"sb_publishable_F7SXxP6kxgh-7or2MEIJ2g_qQInvd-D";

const BUCKET =
"annonces-images";


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const adminBox =
document.getElementById("adminBox");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const logoutBtn =
document.getElementById("logoutBtn");

const addBtn =
document.getElementById("addBtn");

const status =
document.getElementById("status");

const list =
document.getElementById("list");


/* LOGIN */

loginBtn.addEventListener(
"click",
login
);


password.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

login();

}

});


async function login(){

const mail =
email.value.trim();

const pass =
password.value;


if(!mail || !pass){

message.className="error";

message.textContent =
"Veuillez entrer votre email et votre mot de passe.";

return;

}


loginBtn.disabled=true;

loginBtn.textContent =
"Connexion...";

message.textContent="";


try{

const response =
await fetch(
URL+
"/auth/v1/token?grant_type=password",
{

method:"POST",

headers:{
"apikey":KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({

email:mail,

password:pass

})

}
);


const data =
await response.json();


if(!response.ok){

message.className="error";

message.textContent =
"Email ou mot de passe incorrect.";

loginBtn.disabled=false;

loginBtn.textContent =
"Se connecter";

return;

}


localStorage.setItem(
"admin_access_token",
data.access_token
);

localStorage.setItem(
"admin_refresh_token",
data.refresh_token
);


loginBox.style.display="none";

adminBox.style.display="block";


load();


}catch(error){

message.className="error";

message.textContent =
"Erreur de connexion. Vérifiez votre Internet.";

loginBtn.disabled=false;

loginBtn.textContent =
"Se connecter";

}

}


/* TOKEN */

function token(){

return localStorage.getItem(
"admin_access_token"
);

}


/* HEADERS */

function headers(){

return {

"apikey":KEY,

"Authorization":
"Bearer "+token(),

"Content-Type":
"application/json"

};

}


/* CHARGER */

async function load(){

status.textContent =
"Chargement des annonces...";


try{

const response =
await fetch(
URL+
"/rest/v1/annonces?select=*&order=created_at.desc",
{
headers:headers()
}
);


const data =
await response.json();


if(!response.ok){

status.className="error";

status.textContent =
"Erreur : "+JSON.stringify(data);

return;

}


status.textContent="";

render(data);


}catch(error){

status.className="error";

status.textContent =
"Erreur de connexion.";

}

}


/* UPLOAD PHOTO */

async function upload(file){

const filename =
Date.now()+"_"+file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const response =
await fetch(
URL+
"/storage/v1/object/"+
BUCKET+
"/"+
filename,
{

method:"POST",

headers:{

"apikey":KEY,

"Authorization":
"Bearer "+token(),

"Content-Type":
file.type ||
"application/octet-stream"

},

body:file

}
);


if(!response.ok){

throw new Error(
await response.text()
);

}


return filename;

}


/* AJOUT */

addBtn.addEventListener(
"click",
add
);


async function add(){

const titre =
document.getElementById("titre")
.value.trim();

const lieu =
document.getElementById("lieu")
.value.trim();

const prix =
document.getElementById("prix")
.value;

const type =
document.getElementById("type")
.value;

const transaction =
document.getElementById("transaction")
.value;

const description =
document.getElementById("description")
.value;

const files =
document.getElementById("photos")
.files;


if(!titre || !lieu){

status.className="error";

status.textContent =
"Titre et localisation sont obligatoires.";

return;

}


addBtn.disabled=true;

addBtn.textContent =
"Enregistrement...";

status.className="";

status.textContent =
"Préparation de l'annonce...";


try{

let image=null;


if(files.length){

status.textContent =
"Téléversement de la photo...";

image =
await upload(files[0]);

}


status.textContent =
"Enregistrement de l'annonce...";


const response =
await fetch(
URL+
"/rest/v1/annonces",
{

method:"POST",

headers:{
...headers(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

titre:titre,

prix:prix
?Number(prix)
:null,

lieu:lieu,

type:type,

transaction:transaction,

description:description,

image_url:image,

statut:"a_valider"

})

}
);


if(!response.ok){

throw new Error(
await response.text()
);

}


status.className="success";

status.textContent =
"Annonce enregistrée avec succès.";


/* RESET */

document.getElementById("titre")
.value="";

document.getElementById("prix")
.value="";

document.getElementById("lieu")
.value="";

document.getElementById("description")
.value="";

document.getElementById("photos")
.value="";


load();


}catch(error){

status.className="error";

status.textContent =
"Erreur : "+error.message;

}


addBtn.disabled=false;

addBtn.textContent =
"Enregistrer l'annonce";

}


/* STATUT */

async function updateStatus(
id,
newStatus
){

try{

const response =
await fetch(
URL+
"/rest/v1/annonces?id=eq."+
encodeURIComponent(id),
{

method:"PATCH",

headers:{
...headers(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

statut:newStatus

})

}
);


if(!response.ok){

alert(
"Erreur : "+
await response.text()
);

return;

}


load();


}catch(error){

alert(
"Erreur de connexion."
);

}

}


/* SUPPRIMER */

async function removeAnnonce(id){

if(!confirm(
"Supprimer définitivement cette annonce ?"
)){

return;

}


try{

const response =
await fetch(
URL+
"/rest/v1/annonces?id=eq."+
encodeURIComponent(id),
{

method:"DELETE",

headers:headers()

}
);


if(!response.ok){

alert(
"Erreur : "+
await response.text()
);

return;

}


load();


}catch(error){

alert(
"Erreur de connexion."
);

}

}


/* AFFICHAGE */

function render(data){

if(!data.length){

list.innerHTML =

"<div class='empty'>"+
"Aucune annonce pour le moment."+
"</div>";

return;

}


list.innerHTML =
data.map(function(a){


let image="";


if(a.image_url){

image =
URL+
"/storage/v1/object/public/"+
BUCKET+
"/"+
a.image_url;

}


const prix =
a.prix
?
new Intl.NumberFormat("fr-FR")
.format(a.prix)+" Ar"
:
"Prix sur demande";


let statusClass =
"status-badge";


if(a.statut==="publiee"){

statusClass +=
" status-published";

}


const action =
a.statut==="publiee"

?

`<button
onclick="updateStatus('${a.id}','a_valider')">
Dépublier
</button>`

:

`<button
class="ok"
onclick="updateStatus('${a.id}','publiee')">
Publier
</button>`;


return `

<div class="card">

<div class="photo">

${
image
?
`<img
src="${image}"
alt="">`
:
"PHOTO DU BIEN"
}

</div>


<div class="body">

<h3>
${esc(a.titre)}
</h3>


<div class="info">

${esc(a.type||"Bien immobilier")}

<br>

📍 ${esc(a.lieu||"")}

</div>


<div class="price">
${prix}
</div>


<span class="${statusClass}">
Statut : ${esc(a.statut)}
</span>


<div class="actions">

${action}

<button
class="danger"
onclick="removeAnnonce('${a.id}')">

Supprimer

</button>

</div>

</div>

</div>

`;

}).join("");

}


/* SECURITE TEXTE */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(c){

return {

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[c];

}
);

}


/* SESSION EXISTANTE */

const savedToken =
localStorage.getItem(
"admin_access_token"
);


if(savedToken){

loginBox.style.display="none";

adminBox.style.display="block";

load();

}


/* DECONNEXION */

logoutBtn.addEventListener(
"click",
function(){

localStorage.removeItem(
"admin_access_token"
);

localStorage.removeItem(
"admin_refresh_token"
);

location.reload();

});


</script>

</body>
</html>

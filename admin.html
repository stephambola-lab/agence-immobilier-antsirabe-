<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration - Agence Immobilier Antsirabe</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
color:#172033
}

header{
background:#102a43;
color:white;
padding:16px 5%;
font-weight:bold
}

.box{
max-width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 3px 15px #0002
}

.admin{
max-width:1000px;
margin:20px auto;
padding:15px
}

input,select,textarea,button{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font:inherit
}

button{
background:#f4b942;
border:0;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6
}

.logout{
background:#e45b5b;
color:white;
width:auto
}

.ok{
background:#3b8c5a;
color:white
}

.danger{
background:#e45b5b;
color:white
}

.error{
color:#c62828;
font-weight:bold
}

.success{
color:#2e7d32;
font-weight:bold
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{
grid-column:1/-1
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 12px #0001
}

.photo{
height:150px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center
}

.photo img{
width:100%;
height:100%;
object-fit:cover
}

.body{
padding:14px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

@media(max-width:700px){
.form,.grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.box{
margin:20px 10px
}
}
</style>
</head>

<body>

<header>
🔐 Agence Immobilier Antsirabe - Administration
</header>

<div id="loginBox" class="box">

<h2>Connexion administrateur</h2>

<input
id="email"
type="email"
placeholder="Adresse email">

<input
id="password"
type="password"
placeholder="Mot de passe">

<button id="loginBtn">
Se connecter
</button>

<p id="message"></p>

</div>

<div id="adminBox"
class="admin"
style="display:none">

<div style="background:#fff;padding:20px;border-radius:12px">

<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

<h2>Ajouter une annonce</h2>

<button id="logoutBtn"
class="logout">
Déconnexion
</button>

</div>

<div class="form">

<div>
<label>Type</label>

<select id="type">
<option>Maison</option>
<option>Appartement</option>
<option>Terrain</option>
<option>Local commercial</option>
</select>
</div>

<div>
<label>Transaction</label>

<select id="transaction">
<option>À vendre</option>
<option>À louer</option>
</select>
</div>

<div>
<label>Titre</label>

<input
id="titre"
placeholder="Belle maison">
</div>

<div>
<label>Prix (Ar)</label>

<input
id="prix"
type="number">
</div>

<div>
<label>Localisation</label>

<input
id="lieu"
placeholder="Antsirabe">
</div>

<div class="full">
<label>Description</label>

<textarea id="description"></textarea>
</div>

<div class="full">
<label>Photo</label>

<input
id="photos"
type="file"
accept="image/*">
</div>

</div>

<button id="addBtn">
Enregistrer l'annonce
</button>

<p id="status"></p>

</div>

<div id="list" class="grid"></div>

</div>

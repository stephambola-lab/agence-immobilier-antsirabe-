<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration - Agence Immobilier Antsirabe</title>
<style>
body{margin:0;font-family:Arial;background:#f3f5f7;color:#20242a}
.top{background:#123b63;color:#fff;padding:20px}.wrap{max-width:900px;margin:auto;padding:20px}
.box{background:#fff;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:8px;font:inherit}
textarea{min-height:90px}button{background:#123b63;color:white;border:0;font-weight:bold;cursor:pointer}
.ok{background:#23753c}.danger{background:#a52b2b}.item{border:1px solid #ddd;padding:14px;border-radius:10px;margin:10px 0}
.pending{color:#b06b00}.approved{color:#23753c}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><h1>Administration</h1><div>Agence Immobilier Antsirabe</div></div></div>
<div class="wrap">
<div id="loginBox" class="box">
<h2>Connexion admin</h2>
<label>Code d'accès</label>
<input id="accessCode" type="password" inputmode="numeric" placeholder="Entrez le code">
<br><br><button type="button" id="loginBtn">Se connecter</button>
<p id="loginMsg"></p>
</div>

<div id="adminApp" style="display:none">
<div class="box">
<h2>Ajouter une annonce</h2>
<div class="grid">
<input id="title" placeholder="Titre">
<select id="type"><option>Maison</option><option>Appartement</option><option>Terrain</option><option>Local commercial</option></select>
<select id="transaction"><option>Vente</option><option>Location</option></select>
<input id="location" placeholder="Localisation">
<input id="price" placeholder="Prix">
<div style="grid-column:1/-1">
<label for="imageFile"><strong>Photo de l'annonce</strong></label>
<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/*" style="display:none">
<label for="imageFile" style="display:block;background:#123b63;color:white;text-align:center;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer">📷 Choisir une photo dans la galerie</label>
<small style="display:block;margin-top:6px;color:#666">Appuyez sur le bouton puis choisissez une photo dans votre galerie.</small>
<div id="imagePreview" style="margin-top:10px"></div>
</div>
</div>
<br><textarea id="description" placeholder="Description"></textarea>
<br><br><button type="button" id="addBtn">Ajouter l'annonce</button>
</div>

<div class="box"><h2>Gestion des annonces</h2><div id="items"></div></div>
<p><a href="index.html">← Retour au site</a></p>
</div>
</div>

<script>
(function(){
const KEY='v5_listings';
const $=id=>document.getElementById(id);

$('loginBtn').addEventListener('click',function(){
 if($('accessCode').value.trim()==='1234'){
   $('loginBox').style.display='none';
   $('adminApp').style.display='block';
   render();
 }else{
   $('loginMsg').textContent='Code incorrect.';
 }
});

$('accessCode').addEventListener('keydown',function(e){
 if(e.key==='Enter') $('loginBtn').click();
});

$('imageFile').addEventListener('change',function(){
 const file=this.files && this.files[0];
 if(!file){ $('imagePreview').innerHTML=''; return; }
 if(!file.type.startsWith('image/')){ alert('Choisissez une image.'); this.value=''; return; }
 const reader=new FileReader();
 reader.onload=function(){ $('imagePreview').innerHTML='<p style="color:#23753c;font-weight:bold">✓ Photo sélectionnée : '+esc(file.name)+'</p><img src="'+reader.result+'" style="max-width:100%;max-height:220px;border-radius:10px;object-fit:cover">'; };
 reader.onerror=function(){ alert('Le téléphone ou le navigateur ne peut pas lire cette photo. Essayez une autre photo.'); };
 reader.readAsDataURL(file);
});

function resizeImage(file, maxSize=1200, quality=.78){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=function(){
   const img=new Image();
   img.onload=function(){
    let w=img.width,h=img.height;
    if(Math.max(w,h)>maxSize){ const r=maxSize/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    resolve(c.toDataURL('image/jpeg',quality));
   };
   img.onerror=reject; img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$('addBtn').addEventListener('click',async function(){
 let file=$('imageFile').files && $('imageFile').files[0];
 let imageData='';
 if(file){
  try{ imageData=await resizeImage(file); }catch(e){ alert('Impossible de lire cette photo.'); return; }
 }
 let x={
  id:Date.now(),
  title:$('title').value.trim(),
  type:$('type').value,
  transaction:$('transaction').value,
  location:$('location').value.trim(),
  price:$('price').value.trim(),
  image:imageData,
  description:$('description').value.trim(),
  status:'pending'
 };
 if(!x.title||!x.location||!x.price){
   alert('Remplissez au moins le titre, la localisation et le prix.');
   return;
 }
 let d=JSON.parse(localStorage.getItem(KEY)||'[]');
 d.push(x);
 try { localStorage.setItem(KEY,JSON.stringify(d)); } catch(e) { alert('Stockage insuffisant. Essayez une photo plus petite ou supprimez une ancienne annonce.'); return; }
 alert('Annonce ajoutée en attente de validation.');
 ['title','location','price','description'].forEach(id=>$(id).value='');
 $('imageFile').value='';
 $('imagePreview').innerHTML='';
 render();
});

window.approve=function(id){
 let d=JSON.parse(localStorage.getItem(KEY)||'[]').map(
  x=>x.id===id?Object.assign({},x,{status:'approved'}):x
 );
 localStorage.setItem(KEY,JSON.stringify(d));
 render();
};

window.removeAd=function(id){
 let d=JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>x.id!==id);
 localStorage.setItem(KEY,JSON.stringify(d));
 render();
};

function esc(s){
 return String(s||'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[m]));
}

function render(){
 let d=JSON.parse(localStorage.getItem(KEY)||'[]');
 $('items').innerHTML=d.length?d.map(x=>
 '<div class="item"><h3>'+esc(x.title)+'</h3>'+
 '<p>'+esc(x.type)+' • '+esc(x.transaction)+' • '+esc(x.location)+'</p>'+
 '<p>'+esc(x.price)+'</p>'+
 '<p class="'+x.status+'">Statut: '+(x.status==='approved'?'Validée':'En attente')+'</p>'+
 (x.status!=='approved'?'<button class="ok" type="button" onclick="approve('+x.id+')">Valider et publier</button><br><br>':'')+
 '<button class="danger" type="button" onclick="removeAd('+x.id+')">Supprimer</button></div>'
 ).join(''):'Aucune annonce.';
}
})();
</script>
</body>
</html>

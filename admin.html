async function login(){

const mail =
email.value.trim();

const pass =
password.value;


if(!mail || !pass){

message.className="error";

message.textContent =
"Veuillez entrer votre email et votre mot de passe.";

return;

}

loginBtn.disabled=true;

loginBtn.textContent="Connexion...";

message.textContent="";


try{

const response =
await fetch(
URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"apikey":KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:mail,
password:pass
})

}
);


const data =
await response.json();


if(!response.ok){

message.className="error";

message.textContent =
"Email ou mot de passe incorrect.";

loginBtn.disabled=false;

loginBtn.textContent="Se connecter";

return;

}


localStorage.setItem(
"admin_access_token",
data.access_token
);

localStorage.setItem(
"admin_refresh_token",
data.refresh_token
);


message.className="success";

message.textContent =
"Connexion réussie.";


loginBox.style.display="none";

adminBox.style.display="block";


load();


}catch(error){

message.className="error";

message.textContent =
"Erreur de connexion. Vérifiez votre Internet.";

loginBtn.disabled=false;

loginBtn.textContent="Se connecter";

}

}


function token(){

return localStorage.getItem(
"admin_access_token"
);

}


function headers(){

return {

"apikey":KEY,

"Authorization":
"Bearer "+token(),

"Content-Type":
"application/json"

};

}

/* UPLOAD PHOTO CORRIGÉ */

async function upload(file){

const extension =
file.name.includes(".")
?
file.name.split(".").pop().toLowerCase()
:
"jpg";


const filename =
Date.now()+
"_"+Math.random().toString(36).slice(2)+
"."+extension;


const uploadUrl =
URL+
"/storage/v1/object/"+
BUCKET+
"/"+
encodeURIComponent(filename);


const response =
await fetch(
uploadUrl,
{
method:"POST",

headers:{
"apikey":KEY,

"Authorization":
"Bearer "+token(),

"Content-Type":
file.type || "image/jpeg",

"Cache-Control":"3600"
},

body:file
}
);


if(!response.ok){

const text =
await response.text();

throw new Error(
"Upload photo : "+text
);

}


return filename;

}

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#172033}
header{background:#102a43;color:#fff;padding:16px 5%;font-weight:bold}
.box{max-width:500px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 3px 15px #0002}
.admin{max-width:1000px;margin:20px auto;padding:15px}
input,select,textarea,button{width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:8px;font:inherit}

.logout{background:#e45b5b;color:#fff;width:auto}

.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001}
.photo{height:150px;background:#ddd;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}
.body{padding:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:700px){
.form,.grid{grid-template-columns:1fr}
.full{grid-column:auto}
.box{margin:20px 10px}
}
</style>
</head>

const name =
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const path =
Date.now()+"_"+name;


const result =
await sb.storage
.from(BUCKET)
.upload(
path,
file
);


if(result.error){

throw result.error;

}


return path;

}

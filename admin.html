<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Test Administration</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
color:#172033;
}

header{
background:#102a43;
color:white;
padding:18px;
font-weight:bold;
}

.box{
background:white;
max-width:500px;
margin:30px auto;
padding:25px;
border-radius:14px;
box-shadow:0 3px 15px #0002;
}

input{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:13px;
margin-top:15px;
border:0;
border-radius:8px;
background:#f4b942;
font-weight:bold;
font-size:16px;
}

#result{
margin-top:20px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<header>
🔐 Agence Immobilier Antsirabe
</header>

<div class="box">

<h2>Connexion administrateur</h2>

<input
id="email"
type="email"
placeholder="Adresse email">

<input
id="password"
type="password"
placeholder="Mot de passe">

<button
id="loginBtn">
Se connecter
</button>

<p id="result"></p>

</div>

<script>

document
.getElementById("loginBtn")
.addEventListener("click",function(){

document
.getElementById("result")
.textContent="LE BOUTON FONCTIONNE";

});

</script>

</body>

</html>

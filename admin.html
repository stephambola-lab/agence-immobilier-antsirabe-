<!doctype html>
<html lang="fr">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Administration | Agence Immobilier Antsirabe</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

header{
background:#0b2239;
color:white;
padding:14px 5%;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
box-shadow:0 2px 12px #0003;
}

.brand{
font-size:18px;
font-weight:800;
}

.brand span{
color:#f4b942;
}

.back{
background:#f4b942;
color:#172033;
text-decoration:none;
padding:10px 15px;
border-radius:9px;
font-size:14px;
font-weight:800;
white-space:nowrap;
}

.back:hover{
opacity:.9;
}

.box{
max-width:480px;
margin:45px auto;
background:white;
padding:28px;
border-radius:16px;
box-shadow:0 5px 25px #00000012;
}

.box h2{
margin-top:0;
}

.admin{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.panel{
background:white;
padding:24px;
border-radius:16px;
box-shadow:0 4px 18px #00000012;
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:4px;
}

input,
select,
textarea,
button{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #d9dee5;
border-radius:9px;
font:inherit;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
background:#f4b942;
border:0;
font-weight:800;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.logout{
background:#df5757;
color:white;
width:auto;
padding:10px 15px;
}

.ok{
background:#3b8c5a;
color:white;
}

.danger{
background:#df5757;
color:white;
}

.error{
color:#c62828;
font-weight:bold;
}

.success{
color:#2e7d32;
font-weight:bold;
}

.separator{
height:1px;
background:#e4e8ed;
margin:25px 0;
}

.title-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.title-row h2{
margin:0;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 18px #00000012;
}

.photo{
height:180px;
background:#dce3ea;
display:flex;
align-items:center;
justify-content:center;
color:#667788;
font-weight:bold;
overflow:hidden;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.body{
padding:16px;
}

.body h3{
margin:0 0 8px;
font-size:18px;
}

.info{
font-size:14px;
line-height:1.7;
color:#5e6a78;
}

.price{
font-size:18px;
font-weight:800;
color:#174f83;
margin:8px 0;
}

.views{
display:inline-block;
margin-top:8px;
padding:7px 11px;
border-radius:20px;
background:#eef2f7;
color:#52606d;
font-size:13px;
font-weight:800;
}

.status-badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#edf1f5;
color:#52606d;
margin-top:8px;
}

.status-published{
background:#dff3e6;
color:#287542;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

.empty{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
color:#667788;
}

.photo-count{
font-size:13px;
color:#667788;
margin-top:7px;
}

.preview{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.preview img{
width:75px;
height:60px;
object-fit:cover;
border-radius:7px;
border:1px solid #ddd;
}


/* =========================
   DEMANDES CLIENTS
========================= */

.demandes-section{
margin-top:30px;
}

.demandes-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.demandes-header h2{
margin:0;
}

.demandes-count{
background:#0b2239;
color:white;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:800;
}

.demandes-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.demande-card{
background:white;
border-radius:15px;
padding:18px;
box-shadow:0 4px 18px #00000012;
border-left:5px solid #f4b942;
}

.demande-card.traitee{
border-left-color:#3b8c5a;
opacity:.85;
}

.demande-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
}

.demande-name{
font-size:18px;
font-weight:800;
margin:0;
}

.demande-date{
font-size:12px;
color:#7a8795;
margin-top:4px;
}

.demande-status{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:800;
white-space:nowrap;
}

.demande-status.nouvelle{
background:#fff2cc;
color:#946200;
}

.demande-status.traitee{
background:#dff3e6;
color:#287542;
}

.demande-info{
margin-top:14px;
font-size:14px;
line-height:1.8;
color:#4f5d6b;
}

.demande-info strong{
color:#172033;
}

.demande-details{
margin-top:12px;
padding:12px;
background:#f4f6f9;
border-radius:10px;
font-size:14px;
line-height:1.6;
color:#52606d;
}

.demande-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px;
}

.whatsapp{
background:#25d366;
color:white;
}

.call{
background:#174f83;
color:white;
}

.traite{
background:#3b8c5a;
color:white;
}

.demande-delete{
grid-column:1/-1;
}

.no-demandes{
background:white;
padding:30px;
border-radius:12px;
text-align:center;
color:#667788;
box-shadow:0 4px 18px #00000012;
}


/* MOBILE */

@media(max-width:750px){

header{
padding:12px 4%;
}

.brand{
font-size:15px;
}

.back{
font-size:12px;
padding:9px 11px;
}

.admin{
margin:15px auto;
padding:0 10px;
}

.panel{
padding:18px;
}

.form{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.grid{
grid-template-columns:1fr;
}

.title-row{
align-items:flex-start;
flex-direction:column;
}

.logout{
width:auto;
}

.photo{
height:210px;
}

.demandes-grid{
grid-template-columns:1fr;
}

.demandes-header{
align-items:flex-start;
flex-direction:column;
}

.demande-actions{
grid-template-columns:1fr 1fr;
}

}

</style>

</head>

<body>


<header>

<div class="brand">

🔐 Agence Immobilier

<p id="message"></p>

</div>

     ADMIN
========================= -->

<div
id="adminBox"
class="admin"
style="display:none">

</h2>

id="logoutBtn"
class="logout">

Déconnexion

</button>

</div>

Type

Transaction
